<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="100%">
  <defs>
    <!-- Dark Surface Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Subtle Hairline Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>

    <!-- Code Card Gradient -->
    <linearGradient id="codeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" fill-opacity="0.35" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>

  <!-- Background Base -->
  <rect x="1" y="1" width="918" height="258" rx="12" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />
  <rect x="2" y="2" width="916" height="256" rx="11" fill="url(#dotGrid)" />

  <!-- LEFT: Profile & Identity -->
  <g transform="translate(44, 38)">
    
    <!-- Status Pill -->
    <g>
      <rect width="270" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="12" cy="12" r="3.5" fill="#3fb950" />
      <text x="24" y="16" class="font-mono" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="0.5">
        B.TECH CSE • MRIIRS (2026–2030)
      </text>
    </g>

    <!-- Name Heading -->
    <text x="0" y="70" class="font-sans" font-size="34" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">
      Durganand Ishar
    </text>

    <!-- Subtitle -->
    <text x="0" y="100" class="font-sans" font-size="15" font-weight="400" fill="#58a6ff">
      C/C++ &amp; Data Structures • Full-Stack Web Development
    </text>

    <!-- Bio Statement -->
    <text x="0" y="128" class="font-sans" font-size="13" fill="#8b949e">
      First-year undergrad at MRIIRS, Faridabad. Writing code daily, studying algorithms,
    </text>
    <text x="0" y="148" class="font-sans" font-size="13" fill="#8b949e">
      and architecting clean, privacy-first software tools.
    </text>

    <!-- Academic Badges (Clean Monospace Pills) -->
    <g transform="translate(0, 172)">
      <rect width="112" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="0.8" />
      <text x="10" y="15" class="font-mono" font-size="11" fill="#c9d1d9">12th: 95.0%</text>

      <rect x="120" width="118" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="0.8" />
      <text x="130" y="15" class="font-mono" font-size="11" fill="#c9d1d9">10th: 93.75%</text>

      <rect x="246" width="138" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="0.8" />
      <text x="256" y="15" class="font-mono" font-size="11" fill="#79c0ff">Faridabad, India</text>
    </g>

  </g>

  <!-- RIGHT: Real C++ Code Terminal Window -->
  <g transform="translate(560, 36)">
    <!-- Terminal Outer Frame -->
    <rect width="316" height="186" rx="8" fill="url(#codeBg)" stroke="#30363d" stroke-width="1" />
    
    <!-- Titlebar -->
    <rect width="316" height="28" rx="8" fill="#161b22" />
    <path d="M 0 28 L 316 28" stroke="#30363d" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="16" cy="14" r="4.5" fill="#ff5f56" />
    <circle cx="30" cy="14" r="4.5" fill="#ffbd2e" />
    <circle cx="44" cy="14" r="4.5" fill="#27c93f" />

    <!-- File Label -->
    <text x="158" y="18" class="font-mono" font-size="11" fill="#8b949e" text-anchor="middle">
      main.cpp
    </text>

    <!-- Code Content -->
    <g transform="translate(18, 48)" class="font-mono" font-size="12">
      <!-- Line 1 -->
      <text y="0">
        <tspan fill="#ff7b72">#include</tspan> <tspan fill="#a5d6ff">&lt;iostream&gt;</tspan>
      </text>

      <!-- Line 2 -->
      <text y="20">
        <tspan fill="#ff7b72">#include</tspan> <tspan fill="#a5d6ff">&lt;vector&gt;</tspan>
      </text>

      <!-- Line 3 -->
      <text y="44">
        <tspan fill="#ff7b72">int</tspan> <tspan fill="#d2a8ff">main</tspan>() {
      </text>

      <!-- Line 4 -->
      <text y="64" x="14">
        <tspan fill="#79c0ff">std</tspan>::<tspan fill="#d2a8ff">cout</tspan> &lt;&lt; <tspan fill="#a5d6ff">"Hello, World!\n"</tspan>;
      </text>

      <!-- Line 5 -->
      <text y="84" x="14">
        <tspan fill="#8b949e">// Learning C++ &amp; DSA daily</tspan>
      </text>

      <!-- Line 6 -->
      <text y="104" x="14">
        <tspan fill="#ff7b72">return</tspan> <tspan fill="#79c0ff">0</tspan>;
      </text>

      <!-- Line 7 -->
      <text y="124">
        }
      </text>
    </g>
  </g>

</svg>
